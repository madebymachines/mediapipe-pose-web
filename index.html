<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MediaPipe Pose — Frontend Demo</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; font-family: system-ui, Arial, sans-serif; background: #0b0b0c; color: #eaeaea;
      display: grid; place-items: center; min-height: 100dvh;
    }
    .app {
      width: min(960px, 95vw); aspect-ratio: 16/9; position: relative; border-radius: 16px;
      overflow: hidden; background: #111; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    video, canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .ui {
      position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 8px; align-items: center;
      pointer-events: none;
    }
    .badge {
      pointer-events: auto; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12);
      padding: 8px 12px; border-radius: 999px; backdrop-filter: blur(8px); font-size: 14px;
    }
    button {
      pointer-events: auto; border: 1px solid rgba(255,255,255,.15); background: #1a1a1a; color: #fff;
      padding: 8px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: .15s;
    }
    button:hover { transform: translateY(-1px); }
    a { color: #9adfff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div class="ui">
      <span class="badge" id="status">Loading model…</span>
      <button id="startBtn">Start camera</button>
      <button id="flipBtn" title="Switch camera">🔄 Flip</button>
    </div>
  </div>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    // --- DOM refs
    const $video = document.getElementById("video");
    const $canvas = document.getElementById("overlay");
    const ctx = $canvas.getContext("2d", { willReadFrequently: false });
    const $status = document.getElementById("status");
    const $start = document.getElementById("startBtn");
    const $flip = document.getElementById("flipBtn");

    // --- Globals
    let landmarker;
    let running = false;
    let lastVideoTime = -1;
    let facingMode = "user"; // "user" (front) | "environment" (back)
    let stream;

    // Helpful: resize canvas to match video resolution
    function fitCanvasToVideo() {
      const w = $video.videoWidth;
      const h = $video.videoHeight;
      if (!w || !h) return;
      $canvas.width = w;
      $canvas.height = h;
    }

    async function initModel() {
      $status.textContent = "Loading WASM…";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      $status.textContent = "Loading pose model…";
      landmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            // Lite model is fastest; swap to "full" or "heavy" if you want more accuracy.
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU" // falls back to CPU if not available
        },
        runningMode: "VIDEO",
        numPoses: 1,
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      $status.textContent = "Model ready. Click Start camera.";
    }

    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        $video.srcObject = stream;

        await $video.play();
        fitCanvasToVideo();

        running = true;
        $status.textContent = "Running…";
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        $status.innerHTML = `Camera error. Check site permissions.<br/><small>${err.message}</small>`;
      }
    }

    function drawLandmarks(landmarks) {
      // Use DrawingUtils for crisp points/lines
      const draw = new DrawingUtils(ctx);

      // Simple skeleton connections (subset) to keep it lightweight:
      // Pairs of landmark indices (MediaPipe pose has 33 points)
      const C = (a, b) => [a, b];
      const connections = [
        // torso
        C(11,12), C(11,23), C(12,24), C(23,24),
        // left arm
        C(11,13), C(13,15),
        // right arm
        C(12,14), C(14,16),
        // left leg
        C(23,25), C(25,27),
        // right leg
        C(24,26), C(26,28),
        // shoulders to ears (rough)
        C(11,7), C(12,8)
      ];

      // Draw lines
      connections.forEach(([i, j]) => {
        const a = landmarks[i], b = landmarks[j];
        if (!a || !b) return;
        draw.drawConnectors([a, b], [[0, 1]], {
          lineWidth: 3
        });
      });

      // Draw keypoints
      draw.drawLandmarks(landmarks, { radius: 3 });
    }

    function loop() {
      if (!running || !$video.videoWidth) return;

      // Only run a detection when the video has advanced a frame
      const vt = $video.currentTime;
      if (vt !== lastVideoTime) {
        lastVideoTime = vt;

        // Keep canvas in sync if stream changes
        if ($canvas.width !== $video.videoWidth) fitCanvasToVideo();

        // Inference
        const nowMs = performance.now();
        const results = landmarker.detectForVideo($video, nowMs);

        // Draw source frame
        ctx.save();
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);
        ctx.drawImage($video, 0, 0, $canvas.width, $canvas.height);

        // Overlay pose
        if (results?.landmarks?.length) {
          const lm = results.landmarks[0];
          drawLandmarks(lm);
        }
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // UI events
    $start.addEventListener("click", () => startCamera());
    $flip.addEventListener("click", async () => {
      facingMode = (facingMode === "user") ? "environment" : "user";
      await startCamera();
    });

    // Init on load
    initModel();
    window.addEventListener("resize", fitCanvasToVideo);
  </script>

  <!-- Tips:
    - Run locally with: `npx serve` (then open the shown http://localhost:xxxx)
    - For better accuracy, replace the Lite model URL with "full" or "heavy" variants.
    - You can draw more detailed skeletons by expanding the connections list.
  -->
</body>
</html>
